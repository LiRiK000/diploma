<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Нет подключения — Library</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
        color: #e2e8f0;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 55%),
          #0f172a;
      }

      .card {
        width: min(100%, 420px);
        padding: 32px 28px;
        text-align: center;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 48px rgba(2, 6, 23, 0.35);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: rgba(56, 189, 248, 0.12);
        color: #38bdf8;
        font-size: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 700;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.5;
        color: #94a3b8;
      }

      button {
        min-width: 160px;
        padding: 12px 20px;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: #0f172a;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте сеть и попробуйте снова.</p>
      <button type="button" onclick="window.location.reload()">Повторить</button>
    </main>
  </body>
</html>
