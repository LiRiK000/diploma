services:
  db:
    image: postgres:15-alpine
    container_name: diploma_db
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: diploma_minio
    restart: always

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: diploma_minio_init
    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p local/${S3_BUCKET} || true &&
      mc anonymous set public local/${S3_BUCKET} || true
      "

  backend:
    build:
      context: .
      dockerfile: backend-nest/Dockerfile

    container_name: diploma_backend
    restart: always

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

    environment:
      DATABASE_URL: ${DATABASE_URL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      CLIENT_URL: ${CLIENT_URL}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL}

      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      MIGRATE_ON_START: ${MIGRATE_ON_START}

      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER}

      # IMPORTANT: внутри docker-сети
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

    ports:
      - "4000:4000"

    volumes:
      - ./backend-nest/uploads:/app/uploads

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:4000/api/docs || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: diploma_frontend
    restart: always

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
