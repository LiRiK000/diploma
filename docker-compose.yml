version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: diploma_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diploma_db
    ports:
      - "127.0.0.1:15432:5432" # Доступ к базе только локально с сервера
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diploma_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: diploma_minio
    restart: always
    # Порты наружу больше не пробрасываем, так как Nginx (frontend) сам проксирует /covers/ на внутренний 9000 порт
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: diploma_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 admin password123 &&
      mc mb -p local/covers || true &&
      mc anonymous set public local/covers || true
      "

  backend:
    build:
      context: .
      dockerfile: backend-nest/Dockerfile
    container_name: diploma_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/diploma_db?schema=public
      JWT_SECRET: dev_secret
      JWT_REFRESH_SECRET: dev_refresh_secret

      CLIENT_URL: http://${SERVER_IP}
      SERVER_PUBLIC_URL: http://${SERVER_IP}
      S3_PUBLIC_URL: http://${SERVER_IP}

      NODE_ENV: development
      PORT: 4000
      MIGRATE_ON_START: "true"
      FILE_STORAGE_DRIVER: s3

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: password123
      S3_BUCKET: covers
    volumes:
      - ./backend-nest/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:4000/api/docs || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: diploma_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80" # Твой единственный открытый порт для всего приложения

  prisma-studio:
    build:
      context: .
      dockerfile: backend-nest/Dockerfile
    container_name: diploma_prisma_studio
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/diploma_db?schema=public
    ports:
      - "127.0.0.1:5555:5555" # Доступ к студии только через SSH-туннель для безопасности
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
